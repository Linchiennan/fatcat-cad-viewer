# Builds the DWG engine for 大肥貓CAD看圖: libredwg-web v0.8.2 (the JS bindings the app uses) merged with upstream
# LibreDWG 0.14.8625, which reads R2004 drawings whose compressed sections are larger than expected (commit 665b8dde;
# 世舜 門窗圖.dwg failed with error 2160 on 0.14.8608). Same build commands as libredwg-web's package.json.
name: build-libredwg-wasm
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 門窗圖 still failed with the upstream fix merged: try the configure flags (Windows binaries read it).
    strategy:
      fail-fast: false
      matrix:
        # second entry: same code with tracing compiled in (LIBREDWG_TRACE) to locate failures locally
        flags: ['--enable-release --enable-debug', '--enable-debug --enable-trace']
    steps:
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool texinfo pkg-config
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk" && ./emsdk install latest && ./emsdk activate latest
      - name: Sources (libredwg-web v0.8.2 + LibreDWG 0.14.8625)
        run: |
          git clone https://github.com/mlightcad/libredwg-web.git src
          cd src
          git checkout v0.8.2
          git config user.email ci@localhost && git config user.name ci
          git remote add upstream https://github.com/LibreDWG/libredwg.git
          git fetch upstream refs/tags/0.14.8625:refs/tags/0.14.8625
          if ! git merge --no-edit 0.14.8625; then echo "衝突的檔案："; git diff --name-only --diff-filter=U; exit 1; fi
          git submodule update --init --recursive || true
          # 32-bit fix: handle size was checked against sizeof (BITCODE_RC *) = 4 on wasm32, so 5-8 byte handles
          # (門窗圖 HANDSEED 0x10527E5B4) were rejected and every object after them misread. The intended limit is 8.
          sed -i 's/handle->size > sizeof (BITCODE_RC [*])/handle->size > 8/' src/bits.c
          grep -n 'handle->size > 8' src/bits.c
          # R2007 section map: a section may not decompress to more than 10 x the file ("debugging sanity" upstream).
          # DGN linestyle junk compresses far better: 11F 建築底圖.dwg (1.3 MB) has a 21.7 MB section and was rejected
          # outright while ZWCAD opens it. Other limits (790 MB per section, 0xf0000 pages) still guard bad data.
          sed -i 's/section->data_size > 10 [*] dat->size/section->data_size > 100 * dat->size/' src/decode_r2007.c
          grep -n 'section->data_size > 100 \* dat->size' src/decode_r2007.c
          # Handle map: bit_read_UMC reads at most 8 bytes of 7 bits = 56 bits. 敦南 drawings carry handles like
          # 0xFFF7D40F52A0262A (64 bits; ZWCAD keeps them on save), so the handle offset failed to parse, the stream
          # went out of step and no object was found (error 1). 10 bytes cover 64 bits (9 x 7 + 1).
          sed -i 's/#define MAX_BYTE_UMC 8/#define MAX_BYTE_UMC 10/; s/unsigned char byte\[MAX_BYTE_UMC\] = { 0, 0, 0, 0, 0, 0, 0, 0 };/unsigned char byte[MAX_BYTE_UMC] = { 0 };/' src/bits.c
          grep -n 'MAX_BYTE_UMC 10' src/bits.c
          grep -n 'byte\[MAX_BYTE_UMC\] = { 0 };' src/bits.c
          # DXF out of 2D polyline vertices wrote widths (40/41) and bulge (42) only when the vertex flag is non-zero;
          # a plain vertex has flag 0, so arcs and widths were lost (門窗圖 donut: bulge 1 width 1.25 came out as nothing,
          # A07 lost 10 of 20 bulges). The decoder has them; write them for every vertex (BD0 skips zeros anyway).
          perl -0pi -e 's/if \(FIELD_VALUE \(flag\) != 0\)(\s*\{?\s*FIELD_BD0 \((?:start_width|bulge))/if (1)$1/g' src/dwg.spec
          test "$(grep -c 'if (1)' src/dwg.spec)" -ge 2 && grep -n -A2 'if (1)' src/dwg.spec
          # R2004 metadata sections (summary info, saving application, file dependencies, security, revision history)
          # never abort the drawing. E03 開關箱裝高示意圖二.dwg has garbled AppInfo and FileDepList sections:
          # FileDepList num_files 1073741952 overflowed the 32-bit size check, calloc failed and the whole drawing
          # was refused with OUTOFMEM (8192); the 64-bit reader rejects the count and carries on. Drop the file list.
          for s in summaryinfo appinfo filedeplist security revhistory; do
            sed -i "s/^  error = ${s}_private (dat, dwg);\$/&\n  if (error >= DWG_ERR_CRITICAL)\n    error = DWG_ERR_VALUEOUTOFBOUNDS;/" src/decode.c
          done
          # inserted right after the call, so it runs before the error is downgraded
          sed -i 's/^  error = filedeplist_private (dat, dwg);$/&\n  if (error >= DWG_ERR_CRITICAL)\n    dwg->filedeplist.num_files = 0;/' src/decode.c
          grep -n -A2 '^  error = [a-z]*_private (dat, dwg);$' src/decode.c
          test "$(grep -c 'error = DWG_ERR_VALUEOUTOFBOUNDS;' src/decode.c)" -ge 5
          grep -n 'dwg->filedeplist.num_files = 0;' src/decode.c
          # R2013+ REGION / 3DSOLID shapes (AcDs section): each SAB blob was handed to the solids in the order they were
          # read, but the blobs are stored in another order. The search table lists every solid as 64-bit triples
          # (handle, 1, data index), but long handles (26A 0x70739C3) were not found there; each record's own 20-byte
          # header (entry size, 1, handle, offset) names its solid and is tried first.
          # A blob's data index is not its count: the data index table (datidx) lists each record
          # as (segment, offset); the r-th blob inside a _data_ segment is that segment's r-th record by offset (20A: the
          # first record sits in another segment, so the regions are 1..10, not 0..9). PARK 23 12C 客變圖: all 10 regions
          # were off by two, a 6x3 rectangle came out as another region's shape 7,200 units away.
          # A solid missing from the table keeps the old order.
          python3 - <<'PY'
          p = 'src/acds.spec'
          s = open(p, encoding='utf-8').read()
          decl = 'const char start[] = "ACIS BinaryFile";'
          assert s.count(decl) == 1, s.count(decl)
          s = s.replace(decl, decl + '\n    long fc_seg = -1; /* fatcat-acds-map */\n    unsigned int fc_rank = 0;\n    long fc_dseg = -1;\n    int fc_delta = -1;')
          old = 'hdl = SHIFT_HV (dwg, num_acis_sab_hdl, acis_sab_hdl);'
          assert s.count(old) == 1, s.count(old)
          new = '''hdl = NULL;
                      { /* fatcat-acds-map */
                        unsigned int q, sg;
                        long seg = -1;
                        BITCODE_RLL didx = num_acis_sab_data;
                        for (sg = 0; sg < _obj->num_segidx; sg++)
                          if (_obj->segidx[sg].offset && j >= _obj->segidx[sg].offset
                              && j < _obj->segidx[sg].offset + _obj->segidx[sg].size)
                            {
                              seg = (long)sg;
                              break;
                            }
                        if (seg >= 0 && _obj->datidx.entries)
                          {
                            if (seg != fc_seg)
                              {
                                fc_seg = seg;
                                fc_rank = 0;
                              }
                            else
                              fc_rank++;
                            for (q = 0; q < _obj->datidx.num_entries; q++)
                              if ((long)_obj->datidx.entries[q].segidx == seg)
                                {
                                  unsigned int r = 0, q3;
                                  for (q3 = 0; q3 < _obj->datidx.num_entries; q3++)
                                    if ((long)_obj->datidx.entries[q3].segidx == seg
                                        && _obj->datidx.entries[q3].offset < _obj->datidx.entries[q].offset)
                                      r++;
                                  if (r == fc_rank)
                                    {
                                      didx = q;
                                      break;
                                    }
                                }
                          }
                        LOG_TRACE ("fatcat-acds-map blob %u segment %ld rank %u data index %u\\n",
                                   num_acis_sab_data, seg, fc_rank, (unsigned)didx);
                        /* First choice: the record header (entry size, 1, handle, offset; 20 bytes) of that data index
                           names the solid. Where the headers start in the segment is found once per segment: the
                           offset at which the most records carry the handle of a solid still waiting for its data. */
                        if (seg >= 0 && didx < _obj->datidx.num_entries
                            && (long)_obj->datidx.entries[didx].segidx == seg)
                          {
                            if (fc_dseg != seg)
                              {
                                unsigned int dl, best = 0;
                                fc_dseg = seg;
                                fc_delta = -1;
                                for (dl = 0; dl <= 128; dl += 4)
                                  {
                                    unsigned int hits = 0, q4, q5;
                                    for (q4 = 0; q4 < _obj->datidx.num_entries; q4++)
                                      if ((long)_obj->datidx.entries[q4].segidx == seg)
                                        {
                                          size_t at = (size_t)_obj->segidx[seg].offset
                                                      + _obj->datidx.entries[q4].offset + dl + 8;
                                          BITCODE_RLL hv;
                                          if (at + 8 > dat->size)
                                            continue;
                                          memcpy (&hv, &dat->chain[at], 8);
                                          for (q5 = 0; q5 < dwg->num_acis_sab_hdl; q5++)
                                            if (dwg->acis_sab_hdl[q5]->handleref.value == hv)
                                              {
                                                hits++;
                                                break;
                                              }
                                        }
                                    if (hits > best)
                                      {
                                        best = hits;
                                        fc_delta = (int)dl;
                                      }
                                  }
                                LOG_TRACE ("fatcat-acds-map segment %ld headers at +%d (%u handles)\\n", seg,
                                           fc_delta, best);
                              }
                            if (fc_delta >= 0)
                              {
                                size_t at = (size_t)_obj->segidx[seg].offset + _obj->datidx.entries[didx].offset
                                            + fc_delta + 8;
                                if (at + 8 <= dat->size)
                                  {
                                    BITCODE_RLL hv;
                                    memcpy (&hv, &dat->chain[at], 8);
                                    for (q = 0; !hdl && q < dwg->num_acis_sab_hdl; q++)
                                      if (dwg->acis_sab_hdl[q]->handleref.value == hv)
                                        {
                                          hdl = dwg->acis_sab_hdl[q];
                                          memmove (&dwg->acis_sab_hdl[q], &dwg->acis_sab_hdl[q + 1],
                                                   (dwg->num_acis_sab_hdl - q - 1) * sizeof (BITCODE_H));
                                          dwg->num_acis_sab_hdl--;
                                        }
                                  }
                              }
                          }
                        /* Second choice: the search table triple (handle, 1, data index). */
                        for (q = 0; !hdl && q < dwg->num_acis_sab_hdl; q++)
                          {
                            BITCODE_RLL want[3];
                            want[0] = dwg->acis_sab_hdl[q]->handleref.value;
                            want[1] = 1;
                            want[2] = didx;
                            if (memmem (dat->chain, dat->size, want, sizeof (want)))
                              {
                                hdl = dwg->acis_sab_hdl[q];
                                memmove (&dwg->acis_sab_hdl[q], &dwg->acis_sab_hdl[q + 1],
                                         (dwg->num_acis_sab_hdl - q - 1) * sizeof (BITCODE_H));
                                dwg->num_acis_sab_hdl--;
                              }
                          }
                      }
                      if (!hdl)
                        hdl = SHIFT_HV (dwg, num_acis_sab_hdl, acis_sab_hdl);'''
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))
          PY
          grep -n -A3 'fatcat-acds-map' src/acds.spec
          # trace build only: overflow checks reset the log level to the section's opts (0), silencing the rest
          if [[ "${{ matrix.flags }}" == *trace* ]]; then
            sed -i 's/^\( *\)loglevel = dat->opts & DWG_OPTS_LOGLEVEL;\( *\\\)$/\1(void)0;\2/' src/bits.c
            grep -c '(void)0;' src/bits.c
          fi
          git log --oneline -3
      - name: Build
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cd src && sh ./autogen.sh
          mkdir -p build-wasm && cd build-wasm
          emconfigure ../configure CFLAGS="-O2 -sUSE_ZLIB=1 -DNDEBUG" CC=emcc ${{ matrix.flags }} --disable-docs --disable-write --disable-python --disable-bindings --disable-shared --disable-json
          emmake make -j4
          # --emit-tsd needs tsc since Emscripten 2026-11 (the link failed with "tsc executable not found")
          npm install -g typescript@5.6.3
          # em++ (not emcc as in package.json): newer Emscripten links the C++ library only for em++
          em++ ../bindings/javascript/embind/*.cpp src/*.o -O2 -lembind -std=c++17 -Isrc -I../src -I../include -o libredwg-web.js -s ALLOW_MEMORY_GROWTH=1 -s INITIAL_MEMORY=1GB -s MAXIMUM_MEMORY=4GB -s MALLOC=mimalloc -s EXPORT_ES6=1 -s MODULARIZE=1 -s EXPORT_NAME="createModule" -sEXPORTED_RUNTIME_METHODS=FS,ENV,ccall,cwrap,UTF8ToString,stringToNewUTF8,setValue --emit-tsd libredwg-web.d.ts
          ls -la libredwg-web.*
          grep -ao "LibreDWG 0\.[0-9][0-9a-z._-]*" libredwg-web.wasm | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: libredwg-web-wasm-${{ strategy.job-index }}
          path: src/build-wasm/libredwg-web.*
